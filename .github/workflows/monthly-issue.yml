name: Monthly issue

# Claude writes the issue (following RUNBOOK.md); this workflow commits it, rebuilds
# Pages, and hands off to email-issue.yml. Claude never gets a GitHub token.
on:
  schedule:
    # 2nd of each month, 17:07 UTC = 9:07 PST / 10:07 PDT.
    - cron: "7 17 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: write docs/preview/, upload it as a run artifact, no commit, no email"
        type: boolean
        default: true
      window_start:
        description: "Override window start (YYYY-MM-DD). Leave blank for the previous calendar month."
        required: false
      window_end:
        description: "Override window end (YYYY-MM-DD)"
        required: false

concurrency:
  group: monthly-issue
  cancel-in-progress: false

jobs:
  # Claude runs here with no GitHub write access. Only the issue HTML leaves this job.
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.286

      - name: Write the issue
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        run: |
          prompt="Today is $(date -u +%Y-%m-%d). Produce this month's Puppy Chow issue by following RUNBOOK.md exactly. You are running unattended in GitHub Actions: don't ask questions, and don't run git (the workflow commits for you)."
          if [ -n "$WINDOW_START" ] && [ -n "$WINDOW_END" ]; then
            [[ "$WINDOW_START$WINDOW_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Bad window dates"; exit 1; }
            prompt="$prompt Window override: use $WINDOW_START through $WINDOW_END instead of the previous calendar month."
          fi
          if [ "$DRY_RUN" = "true" ]; then
            prompt="$prompt DRY RUN: write the issue to docs/preview/index.html (ignore the 'folder already exists' stop rule), number it as the next issue, and do not edit docs/index.html."
          fi
          claude -p "$prompt" \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Agent,Task,TodoWrite,Bash(curl:*),Bash(date:*),Bash(ls:*),Bash(mkdir:*),Bash(cp:*),Bash(cat:*),Bash(head:*),Bash(grep:*),Bash(wc:*)" \
            --output-format text | tee claude-summary.txt

      - name: Collect output
        run: |
          mkdir -p out
          cp claude-summary.txt out/
          if [ -f docs/preview/index.html ]; then mkdir -p out/preview && cp docs/preview/index.html out/preview/; fi
          for f in $(git status --porcelain --untracked-files=all docs/ | awk '{print $2}' | grep -E '^docs/[0-9]{4}-[0-9]{2}/index\.html$'); do
            mkdir -p "out/$(dirname "$f")" && cp "$f" "out/$f"
          done
          git diff --quiet docs/index.html || { mkdir -p out/docs && cp docs/index.html out/docs/index.html; }
          find out -type f

      - uses: actions/upload-artifact@v4
        with:
          name: puppy-chow-output
          path: out/

  # Fresh checkout; copies in only the validated issue files, then pushes.
  publish:
    needs: write
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      issue_dir: ${{ steps.publish.outputs.issue_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: puppy-chow-output
          path: ${{ runner.temp }}/out

      - name: Commit, push, and rebuild Pages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT: ${{ runner.temp }}/out
        run: |
          issues=$(cd "$OUT" && find docs -type f -path 'docs/*/index.html' 2>/dev/null | grep -E '^docs/[0-9]{4}-[0-9]{2}/index\.html$' || true)
          if [ -z "$issues" ]; then echo "No new issue written; nothing to publish."; exit 0; fi
          [ "$(echo "$issues" | wc -l)" -eq 1 ] || { echo "Expected one new issue, got: $issues"; exit 1; }
          [ -f "$OUT/docs/index.html" ] || { echo "docs/index.html wasn't updated with the new issue"; exit 1; }
          dir=$(dirname "$issues")
          [ ! -e "$dir" ] || { echo "$dir already exists on main"; exit 1; }
          mkdir -p "$dir"
          cp "$OUT/$issues" "$issues"
          cp "$OUT/docs/index.html" docs/index.html
          git -c core.hooksPath=/dev/null -c user.name="Puppy Chow" -c user.email="tjreed15@gmail.com" add docs/
          git -c core.hooksPath=/dev/null -c user.name="Puppy Chow" -c user.email="tjreed15@gmail.com" commit -m "Issue: ${dir#docs/}"
          git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
          gh api -X POST "repos/${REPO}/pages/builds" >/dev/null || echo "Pages build request failed; the push should still trigger one."
          echo "issue_dir=$dir" >> "$GITHUB_OUTPUT"

  email:
    needs: publish
    if: needs.publish.outputs.issue_dir != ''
    uses: ./.github/workflows/email-issue.yml
    with:
      issue_dir: ${{ needs.publish.outputs.issue_dir }}
    secrets: inherit
